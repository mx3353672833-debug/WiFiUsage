name: 问题报告
description: 报告可以稳定复现的错误或异常行为
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先隐藏 Wi-Fi 名称和个人信息，不要上传 `usage.sqlite` 数据库。
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac 类型
      options:
        - Apple Silicon
        - Intel
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序说明如何出现问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 可以附上已经脱敏的截图，但请勿上传本地数据库。
